<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axumera — Loading</title>
<style>
  body { margin:0; font-family:'Segoe UI',Tahoma,sans-serif; background:#FFFFFF; color:#0C2036; }
  .wrap { max-width:520px; margin:0 auto; padding:0 24px; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .accent { width:64px; height:6px; background:#D3A029; border-radius:3px; margin-bottom:28px; }
  h1 { font-size:24px; margin:0 0 8px; color:#0C2036; font-weight:600; }
  .sub { color:#6B7280; font-size:14px; margin-bottom:8px; }
  .version { color:#9AA3AD; font-size:12px; margin-top:4px; }
  .foot { position:fixed; bottom:18px; width:100%; text-align:center; font-size:12px; color:#9AA3AD; }
</style>
</head>
<body>
<div class="wrap">
  <div class="accent"></div>
  <h1>{{APP_NAME}}</h1>
  <div class="sub" id="status">Loading…</div>
  <div class="version">{{VERSION}}</div>
</div>
<div class="foot">© 2026 Axumera Technologies. All rights reserved.</div>
<script>
  (function () {
    var status = document.getElementById('status');
    document.addEventListener('DOMContentLoaded', function () {
      window.chrome.webview.postMessage({ type: 'ready', payload: { app: '{{APP_KEY}}' } });
      status.textContent = 'Preparing your session…';
    });
  })();
</script>
</body>
</html>
